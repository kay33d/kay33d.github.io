<div class="masthead-inner">
  <a class="site-title" href="index.html">{{ site.author.name }}</a>
  <nav class="nav" aria-label="Main">
    {%- for item in site.data.navigation %}
    <a href="{{ item.href }}"{% if page.url == item.url %} class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>
    {%- endfor %}
  </nav>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle day/night mode" title="Toggle day/night mode">
    <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  </button>
</div>
