<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curriculum Vitae — Md Kaidul Islam</title>
<meta name="description" content="Download or preview the full curriculum vitae of Md Kaidul Islam." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="cv">

  <!-- SECTION: NAVIGATION — "The Spine". Content is generated by js/script.js
       from the NAV_ITEMS / SOCIAL_LINKS arrays — edit those arrays once to
       add, remove, or reorder pages/social links across the ENTIRE site. -->
  <nav class="spine" data-spine data-spine-mount></nav>

  <main class="site-main">
    <div class="wrap">

      <div class="page-header">
        <span class="eyebrow">Full Record</span>
        <h1>Curriculum Vitae</h1>
        <p class="lede">The complete, downloadable record of my education, research, and experience. Prefer to browse instead? Every section is also mirrored across this site.</p>
        <div class="btn-row" style="margin-top:28px;">
          <!-- DOWNLOAD SLOT: point this at your real PDF, e.g. assets/CV.pdf -->
          <a class="btn btn-primary" href="assets/CV.pdf" download>Download CV (PDF)</a>
          <a class="btn btn-ghost" href="assets/CV.pdf" target="_blank" rel="noopener">Open in New Tab</a>
        </div>
      </div>

      <!-- SECTION: CV — embedded PDF viewer. Drop your file at assets/CV.pdf -->
      <section class="section">
        <div class="pdf-slot">
          <object data="assets/CV.pdf" type="application/pdf">
            <embed src="assets/CV.pdf" type="application/pdf" />
            <div class="pdf-fallback">
              <div class="pdf-icon"></div>
              <p>Your CV preview will appear here once <code>assets/CV.pdf</code> is added to the project.</p>
            </div>
          </object>
        </div>
        <div class="cv-links">
          <a href="education.html">→ Education</a>
          <a href="experience.html">→ Professional Experience</a>
          <a href="publications-projects.html">→ Publications &amp; Projects</a>
          <a href="awards.html">→ Honors &amp; Awards</a>
        </div>
      </section>

    </div>
  </main>

  <!-- SECTION: FOOTER. Content is generated by js/script.js from the
       FOOTER_LINKS array — edit it once to add/remove/reorder links
       across the ENTIRE site. -->
  <footer class="site-footer" data-footer-mount></footer>
  
  <script src="js/script.js"></script>
</body>
</html>
