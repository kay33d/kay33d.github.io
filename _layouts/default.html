<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="masthead">{% include masthead.html %}</header>

  <div class="layout">
    <aside class="sidebar">{% include sidebar.html %}</aside>

    <main class="page-content">
{{ content }}
    </main>
  </div>

  <footer class="site-footer">{% include footer.html %}</footer>

  <script src="js/script.js"></script>
</body>
</html>
